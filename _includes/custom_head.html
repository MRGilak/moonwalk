{% comment %}
  Custom head fields.
  Currently sets the base URL for the Netlify AI-summary serverless function.
  The static site is hosted on GitHub Pages; the function lives at mgilak.netlify.app.
{% endcomment %}

<script>
  // When running local dev (netlify dev), the function is served on the same
  // origin (localhost:8888/.netlify/functions/summarize), so use a relative
  // path. In production the static site (GitHub Pages) and the Netlify
  // function live on different hosts, so point at the Netlify origin.
  var host = location.hostname;
  window.NETLIFY_FUNCTIONS_BASE =
    (host === "localhost" || host === "127.0.0.1")
      ? ""
      : "https://mgilak.netlify.app";
</script>
