name: Link Checker

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 0

      - name: Build the site
        run: bundle exec jekyll build --baseurl ""

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --config .lychee.toml
            "./_site/**/*.html"
            "./_site/**/*.json"
          fail: true