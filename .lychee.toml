# lychee link-checker configuration
# See https://lychee.cli.rs/configuration/ for all options.

# Links are checked against the BUILT site (_site), never source markdown:
# source files contain Liquid `{{ ... }}` artifacts and root-relative links
# that lychee cannot resolve, which would drown real findings in noise.
# root_dir makes "/assets/..." resolve to "./_site/assets/...".
root_dir = "_site"

# Paths to skip (repo-local plugins and cache; inputs come from explicit globs in args).
exclude_path = [
  ".git",
  "graft",
  "vendor",
]

# Do not check links that point at private/local addresses.
exclude_all_private = true

# HTTP tuning for unreliable public hosts.
max_concurrency = 10
timeout = 20
retry_wait_time = 2
max_retries = 2